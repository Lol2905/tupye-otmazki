<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор Отмазок 3000</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        /* Стиль для кошачьей темы */
        body.cat-theme {
            --bg-color: #1a120b;
            --card-bg: #3c2a21;
            --accent-color: #e5ba73;
        }

        /* Стиль для темы друзей */
        body.friends-theme {
            --bg-color: #121824;
            --card-bg: #1e2640;
            --accent-color: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .tabs {
            display: flex;
            background-color: var(--card-bg);
            padding: 6px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 8px;
        }

        .tab.active {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        .card {
            background-color: var(--card-bg);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 2px solid transparent;
        }

        .card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        #excuse-text {
            font-size: 1.4rem;
            font-weight: 700;
            line-height: 1.5;
            animation: fadeIn 0.4s ease;
        }

        .btn-generate {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 20px 40px;
            font-size: 1.2rem;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            max-width: 320px;
        }

        .btn-generate:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }

        .btn-generate:active {
            transform: scale(0.98);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
            #excuse-text { font-size: 1.1rem; }
            .tab { font-size: 0.8rem; padding: 10px 5px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Отмазки 3000</h1>
        <p class="subtitle">Генерируй железное алиби в один клик</p>

        <div class="tabs">
            <button class="tab active" onclick="setCategory('boss')">💼 Шефу</button>
            <button class="tab" onclick="setCategory('cat')">🐈 Коту</button>
            <button class="tab" onclick="setCategory('friends')">🍻 Друзьям</button>
        </div>

        <div class="card">
            <div id="excuse-text">Нажми на кнопку ниже, чтобы спасти свою репутацию...</div>
        </div>

        <button class="btn-generate" onclick="generateExcuse()">Мне нужна отмазка!</button>
    </div>

    <script>
        // Сюда можно дописывать свои шутки внутри кавычек через запятую
        const excuses = {
            boss: [
                "Я не опоздал, я проводил глубокий анализ рынка по пути от лифта до стола.",
                "Проект задерживается, так как мы столкнулись с непредвиденной квантовой десинхронизацией базы данных. Пишу патч.",
                "Не смог прийти на созвон: провайдер проводил плановое обновление кабеля методом его случайного перерубания.",
                "Я отправил отчет вовремя, но, похоже, его перехватили корпоративные спам-фильтры из-за слишком высокой концентрации гениальности.",
                "Извините за опоздание, я застрял в экзистенциальном кризисе прямо на выходе из комы сна.",
                "Я не залип на ютубе, я тестировал интерфейс на предмет засыпания случайного пользователя."
            ],
            cat: [
                "Я не опоздал с ужином на 5 минут, я выдерживал правильный температурный баланс паштета.",
                "Я купил этот дешевый сухой корм только потому, что дорогой вреден для твоей аристократической фигуры.",
                "Я согнал тебя со стула не из вредности, а чтобы спасти твои черные штаны от моей белой шерсти на джинсах.",
                "Я убрал коробку из-под обуви, потому что она не подходила под твой фэншуй-дизайн коридора.",
                "Я не гладил другого кота на улице! От меня пахнет шавермой исключительно в гастрономических целях."
            ],
            friends: [
                "Ребята, не приеду. У меня тут форс-мажор: диван засел в глухую оборону и взял меня в заложники.",
                "Я уже выхожу! (Перевод: я только что открыл один глаз и пытаюсь вспомнить, кто я).",
                "Не могу пить в пятницу, мой внутренний тамада ушел на больничный по состоянию печени.",
                "Я бы с радостью пошел в бар, но мой гороскоп категорически запрещает мне сегодня тратить деньги и видеть людей.",
                "Я застрял в текстурах своей квартиры, жду перезагрузки сервера.",
                "Мой психотерапевт сказал, что мне нужно временно ограничить общение с успешными и красивыми людьми, так что извините."
            ]
        };

        let currentCategory = 'boss';

        function setCategory(category) {
            currentCategory = category;
            
            document.querySelectorAll('.tab').forEach((tab) => {
                tab.classList.remove('active');
            });
            
            const tabIndex = category === 'boss' ? 0 : category === 'cat' ? 1 : 2;
            document.querySelectorAll('.tab')[tabIndex].classList.add('active');

            document.body.className = '';
            if (category !== 'boss') {
                document.body.classList.add(`${category}-theme`);
            }

            document.getElementById('excuse-text').innerText = "Категория сменена. Жми кнопку!";
        }

        function generateExcuse() {
            const list = excuses[currentCategory];
            const randomIndex = Math.floor(Math.random() * list.length);
            const textElement = document.getElementById('excuse-text');
            
            textElement.style.animation = 'none';
            textElement.offsetHeight; // Сброс анимации для повторного эффекта появления
            textElement.style.animation = 'fadeIn 0.4s ease';
            
            textElement.innerText = list[randomIndex];
        }
    </script>
</body>
</html>
