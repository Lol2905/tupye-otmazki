<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор Отмазок 3000</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body.cat-theme {
            --bg-color: #1a120b;
            --card-bg: #3c2a21;
            --accent-color: #e5ba73;
        }

        body.friends-theme {
            --bg-color: #121824;
            --card-bg: #1e2640;
            --accent-color: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .tabs {
            display: flex;
            background-color: var(--card-bg);
            padding: 6px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 8px;
        }

        .tab.active {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        .card {
            background-color: var(--card-bg);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 2px solid transparent;
        }

        .card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        #excuse-text {
            font-size: 1.4rem;
            font-weight: 700;
            line-height: 1.5;
        }

        .btn-generate {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 20px 40px;
            font-size: 1.2rem;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            max-width: 320px;
            margin-bottom: 40px;
        }

        .btn-generate:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }

        .btn-donate {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: #ef4444;
            border: 2px solid #ef4444;
            padding: 10px 24px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .btn-donate:hover {
            background-color: #ef4444;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
        }

        .btn-donate span {
            margin-right: 8px;
            font-size: 1.1rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
            #excuse-text { font-size: 1.1rem; }
            .tab { font-size: 0.8rem; padding: 10px 5px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Отмазки 3000</h1>
        <p class="subtitle">Генерируй железное алиби в один клик</p>

        <div class="tabs">
            <button class="tab active" onclick="setCategory('boss')">💼 Шефу</button>
            <button class="tab" onclick="setCategory('cat')">🐈 Коту</button>
            <button class="tab" onclick="setCategory('friends')">🍻 Друзьям</button>
        </div>

        <div class="card">
            <div id="excuse-text">Нажми на кнопку ниже, чтобы спасти свою репутацию...</div>
        </div>

        <button class="btn-generate" onclick="generateExcuse()">Мне нужна отмазка!</button>
        
        <br>
        <a href="https://t.me/avs_odin" target="_blank" class="btn-donate">
            <span>☕</span> Скинуться автору на кофе за гениальность
        </a>
    </div>

    <script>
        const excuses = {
            boss: [
                "Я не опоздал. Я пришел вовремя, просто в параллельной вселенной, где рабочий день начинается в два часа дня.",
                "Я не могу сегодня работать, потому что я посмотрел на солнце, моргнул, и у меня внутри перезагрузился Windows.",
                "Извините, проект задерживается. Я нажал 'Сохранить как', и мой компьютер задумался о смысле жизни настолько глубоко, что до сих пор не отвечает.",
                "Я забыл, как ходить на работу. Сидел утром, смотрел на ботинки 40 минут и не понял, какой из них левый, а какой правый.",
                "Меня укусил воздух, у меня теперь аллергия на атмосферное давление офиса.",
                "Я не проспал, я просто моргнул в 7 утра и проснулся в 12. Это временная аномалия, я не виноват."
            ],
            cat: [
                "Я не съел твою влажную еду, я просто подышал на неё, чтобы проверить, не отравили ли её мыши.",
                "Я не наступал тебе на лапу, это сила гравитации Земли внезапно притянула мою пятку к твоему хвосту.",
                "Я закрыл дверь в туалет, чтобы спасти тебя от шума сливного бачка. Я твой телохранитель.",
                "Я не гладил соседа! Я просто вытирал об него руки от чипсов, потому что у него шерсть как салфетка.",
                "Я убрал твой любимый рваный пакет, потому что его разыскивал Интерпол за нарушение тишины по ночам."
            ],
            friends: [
                "Ребят, не приду. Я застрял головой в банке из-под чипсов Pringles, достаю уже третий час.",
                "Я уже выхожу, но у меня шнурок завязался в морской узел 12-го уровня, я ищу в интернете гайд, как его развязать.",
                "Не приду в бар. Я случайно посмотрел на стену и залип на три часа, теперь у меня нет сил на социализацию.",
                "Я не могу пить сегодня, мой пупок потерял центровку, если я сделаю глоток — меня перевесит влево.",
                "Я потерял штаны. Обшарил всю квартиру. Подозрение падает на кота, но у него лапки, так что мы оба сидим дома.",
                "Я не приеду, потому что на улице слишком серо, а моя куртка слишком яркая. Это вызовет визуальный диссонанс у прохожих."
            ]
        };

        let currentCategory = 'boss';

        function setCategory(category) {
            currentCategory = category;
            
            document.querySelectorAll('.tab').forEach((tab) => {
                tab.classList.remove('active');
            });
            
            const tabIndex = category === 'boss' ? 0 : category === 'cat' ? 1 : 2;
            document.querySelectorAll('.tab')[tabIndex].classList.add('active');

            document.body.className = '';
            if (category !== 'boss') {
                document.body.classList.add(`${category}-theme`);
            }

            document.getElementById('excuse-text').innerText = "Категория сменена. Жми кнопку!";
        }

        function generateExcuse() {
            const list = excuses[currentCategory];
            const randomIndex = Math.floor(Math.random() * list.length);
            const textElement = document.getElementById('excuse-text');
            
            textElement.style.animation = 'none';
            textElement.offsetHeight; 
            textElement.style.animation = 'fadeIn 0.4s ease';
            
            textElement.innerText = list[randomIndex];
        }
    </script>
</body>
</html>
